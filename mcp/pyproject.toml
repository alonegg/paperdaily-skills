# Packaging for the public `paperdaily-mcp` distribution.
# Source of truth for the module itself is scripts/paperdaily_mcp.py in the
# main repo; publish_skills.sh assembles mcp/{paperdaily_mcp.py,pyproject.toml,
# README.md} into the public tree. PyPI publish runs from that assembled dir:
#   cd mcp && uv build && uv publish
# Version line is independent of the site VERSION.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperdaily-mcp"
version = "0.1.0"
description = "stdio MCP server for the paperdaily v1 API — 24 tools: daily digests, paper/author search, taxonomy, follows, semantic ask"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "papers", "research", "paperdaily"]
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://www.paperdaily.org"
Repository = "https://github.com/alonegg/paperdaily-skills"

[project.scripts]
paperdaily-mcp = "paperdaily_mcp:main"

[tool.setuptools]
py-modules = ["paperdaily_mcp"]
